<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Her People ♥ — Riddhi's 19th</title>
  <meta name="description" content="Meet the people who love Riddhi — and what they think of her." />
  <link rel="icon" type="image/svg+xml" href="purple-theme/favicon.svg" />
  <link rel="icon" type="image/png" href="purple-theme/favicon.png" />
  <link rel="apple-touch-icon" href="purple-theme/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="friends-page">

  <!-- Floating hearts background canvas -->
  <canvas id="heartsCanvas" aria-hidden="true"></canvas>

  <!-- ── Page header ── -->
  <header class="page-header">
    <a class="nav-btn" href="memories.html" aria-label="Back to memories">
      ← memories
    </a>
    <h1 class="page-title">her people ♥</h1>
  </header>

  <p class="page-subtitle">Digital scrapbook ♥</p>

  <!-- ── Friends grid ── -->
  <main class="page-main">
    <div class="friends-grid" id="friendsGrid" role="list" aria-label="Riddhi's friends">
      <!-- Cards injected by friends.js -->
    </div>
  </main>

  <!-- ── Detail overlay ── -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dcName" aria-hidden="true">
    <div class="overlay__backdrop" id="overlayBackdrop"></div>

    <div class="detail-card" id="detailCard">
      <button class="detail-card__close" id="overlayClose" type="button" aria-label="Close">&#x00D7;</button>

      <!-- Name + nickname -->
      <div class="detail-card__name-wrap">
        <h2 class="detail-card__name" id="dcName"></h2>
        <p class="detail-card__nick" id="dcNick"></p>
        <span class="detail-card__rule"></span>
      </div>

      <!-- Two-column body -->
      <div class="detail-card__body">
        <!-- Left: photo -->
        <div class="detail-card__photo-col">
          <div class="detail-card__photo-wrap">
            <img class="detail-card__photo" id="dcPhoto" src="" alt="" />
          </div>
        </div>

        <!-- Right: Q&A -->
        <div class="detail-card__qa" id="dcQA">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/friends.js"></script>
</body>
</html>
