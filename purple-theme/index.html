<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy Birthday ♥ — a little film with memories</title>
  <meta name="description" content="A cinematic birthday film with memory polaroids blooming on a tree of hearts." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

  <script>document.documentElement.classList.add('js')</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>window.gsap || document.write('<script src="./vendor/gsap.min.js"><\/script>')</script>
  <link rel="stylesheet" href="./birthday.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <main class="scene">

    <!-- The tree world (Act 4). Canvas draws mist sky + amethyst tree -->
    <canvas id="tree" class="tree" aria-label="A blossom tree grows and blooms into a heart made of purple petals" role="img"></canvas>

    <!-- Hanging Memory Polaroids on the tree branches (revealed in Act 4) -->
    <div class="memories" id="memories" aria-label="Memory photo charms on the tree"></div>

    <!-- ACT 1 — THE INVITATION -->
    <section class="hero" id="hero" aria-label="Draw the bow to open your card">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__motes" id="motes" aria-hidden="true"></div>

      <p class="hero__eyebrow" id="eyebrow">Surpriseeeee!!</p>

      <!-- THE TARGET — the purple heart the arrow flies to -->
      <div class="targetWrap" aria-hidden="true">
        <div class="target" id="target" title="Tap me!">
          <span class="heart__glow" aria-hidden="true"></span>
          <span class="target__heart" id="targetHeart">
            <svg class="heart__svg" viewBox="0 0 100 92" aria-hidden="true">
              <defs>
                <radialGradient id="hg" cx="38%" cy="30%" r="80%">
                  <stop offset="0%"  stop-color="#f5d0fe" />
                  <stop offset="42%" stop-color="#c084fc" />
                  <stop offset="82%" stop-color="#9333ea" />
                  <stop offset="100%" stop-color="#581c87" />
                </radialGradient>
                <linearGradient id="hsheen" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"  stop-color="rgba(255,255,255,.9)" />
                  <stop offset="34%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>
              </defs>
              <path d="M50 86.5C26 68 10.5 53.6 10.5 34.6 10.5 20.4 21 11 33.2 11c8.6 0 14.2 4.7 16.8 11.4C52.6 15.7 58.2 11 66.8 11 79 11 89.5 20.4 89.5 34.6 89.5 53.6 74 68 50 86.5Z" fill="url(#hg)" />
              <path d="M50 86.5C26 68 10.5 53.6 10.5 34.6 10.5 20.4 21 11 33.2 11c8.6 0 14.2 4.7 16.8 11.4C52.6 15.7 58.2 11 66.8 11 79 11 89.5 20.4 89.5 34.6 89.5 53.6 74 68 50 86.5Z" fill="url(#hsheen)" opacity=".72" />
              <ellipse cx="34" cy="30" rx="8.5" ry="5.4" fill="#fff" opacity=".78" style="mix-blend-mode:screen" />
            </svg>
          </span>
        </div>
      </div>

      <!-- THE BOW + ARROW -->
      <div class="archery" id="archery" role="button" tabindex="0"
           aria-label="Draw the bow and release to send the arrow to the heart">

          <!-- aim line -->
          <div class="aim" id="aim" aria-hidden="true"></div>

          <!-- recurve bow -->
          <svg class="bow" id="bow" viewBox="0 0 460 300" aria-hidden="true">
            <defs>
              <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"   stop-color="#2e1065" />
                <stop offset=".18" stop-color="#4c1d95" />
                <stop offset=".5"  stop-color="#6b21a8" />
                <stop offset=".82" stop-color="#4c1d95" />
                <stop offset="1"   stop-color="#2e1065" />
              </linearGradient>
              <linearGradient id="limbHi" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(233,213,255,.8)" />
                <stop offset="1" stop-color="rgba(233,213,255,0)" />
              </linearGradient>
              <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#1e1b4b" />
                <stop offset=".5" stop-color="#3b0764" />
                <stop offset="1" stop-color="#1e1b4b" />
              </linearGradient>
            </defs>
            <path class="bow__limb" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
                  fill="none" stroke="url(#limb)" stroke-width="13" stroke-linecap="round" />
            <path class="bow__limbHi" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
                  fill="none" stroke="url(#limbHi)" stroke-width="3" stroke-linecap="round" opacity=".7" />
            <path d="M34 96 C 22 82, 26 70, 40 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
            <path d="M426 96 C 438 82, 434 70, 420 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
            <rect x="216" y="206" width="28" height="70" rx="9" fill="url(#grip)" />
            <path d="M219 220h22 M219 236h22 M219 252h22" stroke="rgba(0,0,0,.4)" stroke-width="2" />
            <line class="bow__str" id="strL" x1="40" y1="70" x2="230" y2="96" stroke="#b8a5d6" stroke-width="2.2" stroke-linecap="round" />
            <line class="bow__str" id="strR" x1="420" y1="70" x2="230" y2="96" stroke="#b8a5d6" stroke-width="2.2" stroke-linecap="round" />
            <circle class="bow__serving" id="serving" cx="230" cy="96" r="4.5" fill="#581c87" />
          </svg>

          <!-- the arrow: winged golden heart tip -->
          <svg class="arrow" id="arrow" viewBox="0 0 64 220" aria-hidden="true">
            <defs>
              <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#2e1065" />
                <stop offset=".5" stop-color="#581c87" />
                <stop offset="1" stop-color="#1e1b4b" />
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffe38c" />
                <stop offset=".45" stop-color="#f4a626" />
                <stop offset="1" stop-color="#a85f0e" />
              </linearGradient>
              <linearGradient id="feath" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e879f9" />
                <stop offset=".5" stop-color="#a855f7" />
                <stop offset="1" stop-color="#6b21a8" />
              </linearGradient>
              <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="1" stop-color="#e9d5ff" />
              </linearGradient>
            </defs>

            <!-- shaft -->
            <rect x="29.4" y="30" width="5.2" height="168" rx="2.6" fill="url(#shaft)" />

            <!-- angel wings -->
            <g class="arrow__wings">
              <path class="wingL" d="M31 30 C 10 16, 2 20, 4 34 C 12 30, 20 32, 31 40 Z" fill="url(#wing)" stroke="rgba(168,85,247,.72)" stroke-width="1.2"/>
              <path class="wingR" d="M33 30 C 54 16, 62 20, 60 34 C 52 30, 44 32, 33 40 Z" fill="url(#wing)" stroke="rgba(168,85,247,.72)" stroke-width="1.2"/>
            </g>

            <!-- golden heart arrowhead -->
            <path class="arrow__head" d="M32 12 C 30 7, 22 6.5, 21.5 13 C 21 18, 27 22, 32 27 C 37 22, 43 18, 42.5 13 C 42 6.5, 34 7, 32 12 Z" fill="url(#gold)" stroke="#a5701a" stroke-width=".8" />
            <ellipse cx="27" cy="13" rx="2.6" ry="1.7" fill="#fff" opacity=".8" style="mix-blend-mode:screen" />

            <!-- violet feather fletching -->
            <g class="arrow__fletch">
              <path d="M32 150 C 16 156, 10 178, 15 200 C 24 194, 30 184, 32 176 Z" fill="url(#feath)" />
              <path d="M32 150 C 48 156, 54 178, 49 200 C 40 194, 34 184, 32 176 Z" fill="url(#feath)" opacity=".92" />
              <path d="M28 160l4 3 M26 170l6 3 M25 180l7 3" stroke="rgba(88,28,135,.45)" stroke-width="1" />
              <path d="M36 160l-4 3 M38 170l-6 3 M39 180l-7 3" stroke="rgba(88,28,135,.45)" stroke-width="1" />
            </g>
            <path d="M29 200 L32 205 L35 200" fill="none" stroke="#c9a25a" stroke-width="2" stroke-linecap="round"/>
            <circle id="tip" cx="32" cy="9" r="0.6" fill="none" />
          </svg>
      </div>

      <p class="hero__hint" id="hint">pull &amp; release</p>
    </section>

    <!-- ACT 2 — THE FLOOD -->
    <div class="flood" id="flood" aria-hidden="true"></div>

    <!-- ACT 3 — THE WISH (kinetic type on purple field) -->
    <div class="field" id="field" aria-hidden="true">
      <div class="blob blob--1"></div>
      <div class="blob blob--2"></div>
      <div class="blob blob--3"></div>
      <div class="fgrid" id="fgrid"></div>
      <div class="fvignette"></div>

      <div class="camera" id="camera">
        <p class="kEyebrow" id="kEyebrow">make a wish&hellip;</p>
        <h2 class="headline" id="headline">
          <span class="hl__line"><span class="mask"><span class="hl__word" id="wLine1">Happy</span></span></span>
          <span class="hl__line"><span class="mask"><span class="hl__word" id="wLine2">Birthday</span></span></span>
          <span class="hl__line"><span class="mask"><span class="hl__word" id="wLine3">RIDDHI !!!</span></span></span>
        </h2>
        <svg class="uline" id="uline" viewBox="0 0 300 26" fill="none" aria-hidden="true">
          <path class="uline__path" d="M8 16C56 7 132 4 178 6c30 1 78 5 114 12-40 3-108 4-176 3"
                stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="kSub" id="kSub"></p>
      </div>

      <div class="bar bar--top" id="barTop"></div>
      <div class="bar bar--bot" id="barBot"></div>
    </div>

    <!-- The gold/violet light that bridges the wish into the tree -->
    <div class="bloom" id="bloom" aria-hidden="true"></div>

    <!-- ACT 4 — THE HAND-LETTERED WISH -->
    <div class="wish" id="wish" aria-hidden="true">
      <p class="wish__eyebrow" id="wEyebrow">Dear, RIDDHI AGRAWAL</p>
      <div class="wish__heroWrap"><h1 class="wish__hero" id="wHero">Happy Birthday</h1></div>
      <span class="wish__rule" id="wRule"></span>
      <p class="wish__sub" id="wSub">here&rsquo;s to a year that blooms</p>
    </div>

    <!-- ACT 4 — PORTRAIT FIGURE (Right Frame) -->
    <div class="portrait" id="portrait" aria-hidden="true">
      <div class="portrait__aura"></div>
      <img class="portrait__img" src="./photos/baground.png" alt="Riddhi Agrawal" />
    </div>

    <!-- Nav to memories page (shown in Act 4) -->
    <a class="nav-btn friends-nav" id="friendsNav" href="../memories.html" hidden>
      her memories ♥
    </a>


    <!-- Lens overlay: vignette + grain -->
    <div class="grade" aria-hidden="true">
      <div class="grade__vignette"></div>
      <div class="grade__grain"></div>
    </div>

    <!-- LIGHTBOX MODAL for viewing enlarged memories -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
      <div class="lightbox__content">
        <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close memory">&times;</button>
        <div class="lightbox__card">
          <div class="lightbox__tape"></div>
          <div class="lightbox__frame">
            <img class="lightbox__img" id="lightboxImg" src="" alt="Memory Photo" />
          </div>
          <div class="lightbox__info">
            <p class="lightbox__caption" id="lightboxCaption"></p>
            <span class="lightbox__date" id="lightboxDate"></span>
          </div>
        </div>
      </div>
    </div>

  </main>

  <p class="sr-only">Happy Birthday. Here&rsquo;s to a wonderful year ahead.</p>

  <script src="./birthday.js" defer></script>
</body>
</html>
